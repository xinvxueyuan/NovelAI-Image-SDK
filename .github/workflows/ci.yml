name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    uses: ./.github/workflows/repo-check.yml

  rust:
    name: Rust (${{ matrix.os }})
    needs: repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Nextest
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest@0.9.150

      - name: Lint the Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        run: cargo nextest run --workspace --all-features --profile ci --locked --no-tests=fail

      - name: Build docs
        if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --all-features

  golden:
    name: Golden parity
    needs: repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Prepare Rust
        uses: ./.github/actions/setup-rust

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Regenerate fixtures from the pinned reference
        # `gen_fixtures.py` resolves the reference relative to its CWD, while
        # `uv run --directory` changes into the reference's own package dir.
        # Pass the checkout explicitly so both stay correct.
        env:
          NOVELAI_REFERENCE_ROOT: ${{ github.workspace }}/third_party/novelai-image-mcp
        run: uv run --directory third_party/novelai-image-mcp/apps/server python "$GITHUB_WORKSPACE/scripts/gen_fixtures.py"

      - name: Fixtures must be committed
        run: git diff --exit-code fixtures/

      - name: Parity tests
        run: cargo test -p novelai-image-sdk --test golden

  ci-result:
    name: CI result
    if: ${{ !cancelled() }}
    needs: [repository, rust, golden]
    runs-on: ubuntu-26.04
    steps:
      - name: Require repository and Rust checks to pass
        run: |
          if [ "${{ needs.repository.result }}" != "success" ] \
            || [ "${{ needs.rust.result }}" != "success" ] \
            || [ "${{ needs.golden.result }}" != "success" ]; then
            echo "A required job did not pass."
            exit 1
          fi
