name: Release

# A tag push is the only way to release. The `validate` job refuses a tag whose
# manifests disagree with the crate version, so a half-synced release fails
# before anything is published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.1.0)
        required: true
      dry_run:
        description: Build and verify every artifact, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.100.0"

      - name: The tag must match the manifest version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version }}" ]; then tag="${{ inputs.version }}"; fi
          manifest=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version' | sed 's/.*= *"\(.*\)"/\1/')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # A tag push always publishes; a manual run publishes only when the
          # caller turned dry-run off.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Manifests must agree
        run: cargo run -p xtask -- sync-versions --check

      - name: The tag must point at a commit on main
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi

      - name: Release notes must exist
        if: steps.version.outputs.dry_run == 'false'
        run: test -f "release-notes/${{ steps.version.outputs.version }}.json"

      - name: The changelog must have a section for this version
        run: grep -q "^## \\[${{ steps.version.outputs.version }}\\]" CHANGELOG.md

  test:
    name: Gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    # ci.yml gates publication; it must not run on stale cached artifacts.
    permissions:
      contents: read

  crate:
    name: crates.io
    needs: [validate, test]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Verify the crate packages
        run: cargo publish -p novelai-image-sdk --locked --dry-run
      # crates.io is immutable, so a rerun of a version that already landed is a
      # no-op rather than an error. Without this the whole release goes red for
      # a registry that is already correct, and every downstream job that needs
      # this one is skipped with it.
      - name: Skip a version that is already on the index
        id: published
        if: needs.validate.outputs.dry_run == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version' | sed 's/.*= *"\(.*\)"/\1/')"
          if curl -fsS -A "NovelAI-Image-SDK release workflow" \
              "https://crates.io/api/v1/crates/novelai-image-sdk/${version}" \
              -o /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "novelai-image-sdk@${version} is already on crates.io"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: needs.validate.outputs.dry_run == 'false' && steps.published.outputs.exists != 'true'
        run: cargo publish -p novelai-image-sdk --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  python-wheels:
    name: Python wheels (${{ matrix.os }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux wheel must link an old glibc to be installable on
          # long-term-support distributions. The runner image is not, so the
          # build runs inside the official manylinux_2_28 container.
          - os: manylinux_2_28_x86_64
            runs-on: ubuntu-26.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: windows-2025
            runs-on: windows-2025
            container: ""
          - os: macos-26
            runs-on: macos-26
            container: ""
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build prerequisites in the container
        if: matrix.container != ''
        # The container has neither Rust nor libclang; both are needed.
        #
        # `RUSTUP_HOME` and `CARGO_HOME` are exported to `$GITHUB_ENV` because
        # the runner points `HOME` at /github/home while the container user's
        # real home is /root, and rustup refuses to run when the two disagree.
        run: |
          export RUSTUP_HOME=/root/.rustup CARGO_HOME=/root/.cargo
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs             | sh -s -- -y --profile minimal --default-toolchain 1.100.0
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
          dnf install -y clang cmake nasm perl-core zlib-devel
      - uses: ./.github/actions/setup-rust
        if: matrix.container == ''
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.container == ''
        with:
          python-version: "3.13"
      - name: Generate the binding module
        run: cargo run -p xtask -- bindings --language python --release
      - name: Build the wheel
        working-directory: bindings/python
        shell: bash
        # Bash on every runner so the same POSIX script works; the commands are
        # still `python …` rather than `cp`/`for`, which is what the Windows
        # failure earlier was about.
        #
        # The manylinux image does not put an interpreter on PATH; it ships
        # them under /opt/python. `$PYTHON` resolves once here so the same
        # commands work in both environments (GITHUB_ENV does not reach inside
        # the container).
        run: |
          PYTHON=python
          if [ -d /opt/python/cp313-cp313/bin ]; then
            PYTHON=/opt/python/cp313-cp313/bin/python
          fi
          "$PYTHON" -m pip install --upgrade build setuptools setuptools-rust wheel
          "$PYTHON" -c "import shutil; shutil.copy('../../LICENSE', 'LICENSE')"
          "$PYTHON" -m build --wheel
          "$PYTHON" scripts/retag_wheel.py
      - name: Repair the Linux wheel
        if: matrix.container != ''
        working-directory: bindings/python
        shell: bash
        # Renaming the tag is not enough: PyPI rejects `linux_x86_64`, and a
        # wheel claiming manylinux must actually link an older glibc than the
        # ubuntu-26.04 runner ships. auditwheel inspects the ELF symbols and
        # picks the tag; it fails loudly when the binary needs a newer glibc
        # than any long-term-support baseline provides, which is the signal to
        # move the build into a manylinux container.
        run: |
          PYTHON=/opt/python/cp313-cp313/bin/python
          "$PYTHON" -m pip install --quiet auditwheel
          # Repair into a scratch directory, then swap it in for the original:
          # keeping both would upload the `linux_x86_64` wheel too, which PyPI
          # rejects.
          mkdir -p wheelhouse
          "$PYTHON" -m auditwheel repair --wheel-dir wheelhouse dist/*.whl
          rm -f dist/*.whl
          mv wheelhouse/*.whl dist/
          rmdir wheelhouse
          ls dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  pypi:
    name: PyPI
    needs: [validate, python-wheels]
    runs-on: ubuntu-26.04
    environment: release
    # PyPI Trusted Publishing: no token, the OIDC identity is the credential.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check the wheels
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*
          # PyPI refuses `linux_x86_64`; catch it here rather than after the
          # upload has half-succeeded.
          if ls dist/*linux_x86_64.whl dist/*linux_aarch64.whl >/dev/null 2>&1; then
            echo "::error::a bare linux_* wheel is in dist; PyPI will reject it"
            exit 1
          fi
          ls -la dist/
      - name: Publish to PyPI
        if: needs.validate.outputs.dry_run == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          # PyPI is immutable, so a rerun of a version that already landed is a
          # no-op rather than a 400. Reruns are the normal repair path for a
          # sibling job, and this one would otherwise block the release.
          skip-existing: true

  npm:
    name: npm (${{ matrix.target }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          # Native x64, so BoringSSL is not cross-compiled.
          - os: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the cross target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Install the napi CLI
        working-directory: bindings/node
        shell: bash
        run: npm install --no-save @napi-rs/cli@3
      - name: Build the addon
        working-directory: bindings/node
        # One line on purpose: a backslash continuation is not portable
        # across the default shells of the three runners.
        run: npx napi build --release --platform --manifest-path ../../crates/novelai-image-ffi-napi/Cargo.toml --output-dir . --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  npm-publish:
    name: npm publish
    needs: [validate, npm]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 ships npm 11.19.1. Trusted publishing needs npm >= 11.5.1 and
      # staged publishing needs >= 11.15.0; the Node 22 image carries npm 10.9.9,
      # which silently falls back to token auth and then fails.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: bindings/node
          merge-multiple: true
      - name: Install the napi CLI
        working-directory: bindings/node
        shell: bash
        run: npm install --no-save @napi-rs/cli@3
      - name: Build the platform packages
        working-directory: bindings/node
        # `create-npm-dirs` reads the `.node` files beside package.json (the
        # download step put them there); `napi artifacts` expects a separate
        # `artifacts/` directory that this layout does not use.
        run: |
          npx napi create-npm-dirs
          # Each downloaded addon is named `<binary>.<platformArchABI>.node`.
          # Move it into the matching platform package by that suffix, so a
          # Windows binary can never land in the macOS package.
          for addon in *.node; do
            suffix="${addon#*.}"          # drop the binary name
            suffix="${suffix%.node}"      # drop the extension
            if [ -d "npm/$suffix" ]; then
              mv "$addon" "npm/$suffix/"
            else
              echo "no platform package for $addon" >&2
              exit 1
            fi
          done
          ls -R npm | head -30
      - name: Pack the tarballs
        working-directory: bindings/node
        run: |
          # `npm pack` exercises the same manifest resolution as publish and
          # writes a tarball we can inspect.
          mkdir -p /tmp/npm-packs
          for dir in npm/*/; do
            npm pack "$dir" --pack-destination /tmp/npm-packs
          done
          npm pack --pack-destination /tmp/npm-packs
          ls -la /tmp/npm-packs
      - name: Rehearse the staging step
        if: needs.validate.outputs.dry_run != 'false'
        working-directory: bindings/node
        shell: bash
        # `--dry-run` runs the whole staging path — manifest resolution, files
        # list, tarball — and stops before the upload, so a packaging mistake
        # fails here instead of on the tagged release.
        run: |
          set -euo pipefail
          for dir in npm/*/; do
            npm stage publish "$dir" --access public --dry-run
          done
          npm stage publish --access public --dry-run
      # Authentication is OIDC trusted publishing: `id-token: write` above is
      # the whole credential. There is no NPM_TOKEN, and an access token could
      # not publish here anyway — the account enforces 2FA, and only a token
      # allowed to bypass it could, which is a weaker arrangement than this one.
      # Each package's trusted publisher must name xinvxueyuan/NovelAI-Image-SDK,
      # this workflow file, and the `release` environment.
      - name: Skip an already published version
        id: published
        if: needs.validate.outputs.dry_run == 'false'
        working-directory: bindings/node
        shell: bash
        # Re-running a release must not fail just because the version is
        # already on the registry: that is a no-op, not an error.
        #
        # Per package, not once for the root: the six do not publish together.
        # A run that dies after the first three leaves the rest behind, and a
        # root-only check then skips every remaining one permanently.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          pending=0
          for dir in npm/*/; do
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry"
            else
              echo "$name@$version still needs publishing"
              pending=$((pending + 1))
            fi
          done
          root="$(node -p "require('./package.json').name")"
          if ! npm view "$root@$version" version >/dev/null 2>&1; then
            echo "$root@$version still needs publishing"
            pending=$((pending + 1))
          fi
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - name: Stage for review
        if: needs.validate.outputs.dry_run == 'false' && steps.published.outputs.pending != '0'
        working-directory: bindings/node
        shell: bash
        # Staged publishing, not a direct publish: CI puts the version in the
        # review queue and a maintainer approves it with a one-time password on
        # npmjs.com. That is what lets the account keep 2FA enforced while the
        # workflow holds no long-lived credential.
        #
        # The platform packages go first because the root package's
        # `optionalDependencies` point at them. Each is skipped individually if
        # the version is already on the registry, so a partial earlier run is
        # repaired rather than published over.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          stage() {
            local target="$1" name
            name="$(node -p "require('./$target/package.json').name")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
              return 0
            fi
            # A version can also be waiting in the review queue from an earlier
            # run. `npm stage list` needs interactive authentication and is not
            # available here, so treat the 409 as the signal that it is already
            # staged: the entry survives for a maintainer to approve, which is
            # exactly the state we were trying to reach.
            if output="$(npm stage publish "$target" --access public --provenance 2>&1)"; then
              echo "$output"
            elif printf '%s' "$output" | grep -q 'E409\|Cannot stage previously published'; then
              echo "$name@$version is already staged for review; skipping"
            else
              echo "$output"
              return 1
            fi
          }
          for dir in npm/*/; do
            stage "$dir"
          done
          stage .

  kotlin:
    name: Kotlin JAR
    needs: [validate, test]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Package the Linux native library
        run: cargo run -p xtask -- bindings --language kotlin --release
      - name: Build the JAR
        working-directory: bindings/kotlin
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-jar
          path: bindings/kotlin/build/libs/*.jar

  kotlin-native:
    name: Kotlin native library (${{ matrix.platform }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win-x64
          - os: macos-26
            platform: mac-arm64
          - os: ubuntu-26.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Build the library
        run: cargo run -p xtask -- bindings --language kotlin --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-native-${{ matrix.platform }}
          path: bindings/kotlin/src/main/resources/${{ matrix.platform }}/

  maven:
    name: Maven Central
    needs: [validate, test, kotlin, kotlin-native]
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kotlin-native-*
          path: bindings/kotlin/src/main/resources
          merge-multiple: false
      - name: Flatten the native resources
        working-directory: bindings/kotlin/src/main/resources
        run: |
          # download-artifact nests each artifact under its own directory;
          # move `<platform>/…` up one level so the JAR layout is flat.
          for dir in kotlin-native-*/; do
            platform="${dir#kotlin-native-}"
            platform="${platform%/}"
            mkdir -p "$platform"
            cp -r "$dir"* "$platform"/ 2>/dev/null || true
            rm -rf "$dir"
          done
          ls -R .
      - name: Publish to Maven Central
        working-directory: bindings/kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # Central requires a detached signature on every artifact. The same
          # key that signs commits signs the JAR.
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          # A dry run publishes to a local directory instead of Central. The
          # variable must be *absent* for a real publish: setting it to the
          # Central URL selects the unauthenticated local repository branch.
          MAVEN_CENTRAL_URL: ${{ needs.validate.outputs.dry_run == 'true' && format('file://{0}/maven-dry-run', github.workspace) || '' }}
        run: gradle publish --no-daemon
      # Central verifies each `.asc` by looking the signing key up on a public
      # keyserver. Signing locally is not enough: a key that was never
      # published fails the check with "Could not find a public key by the key
      # fingerprint", which is what blocked the first 0.2.0 attempt. Upload the
      # public half here so every release carries a resolvable signature.
      - name: Publish the signing key to the keyservers
        if: needs.validate.outputs.dry_run == 'false'
        id: signing-key
        env:
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "$fingerprint"
          echo "signing key: $fingerprint"
          # `keyserver.ubuntu.com` is the SKS instance Central checks first, and
          # it accepts a non-interactive upload. `keys.openpgp.org` is the other
          # one Central documents; it stores the key material without a
          # verified UID, which is enough for a fingerprint lookup.
          gpg --batch --keyserver hkps://keyserver.ubuntu.com \
            --send-keys "$fingerprint"
          # `pgp.mit.edu` is the third server Central supports; it is slow and
          # occasionally unavailable, so a failure here must not sink the
          # release — the other two already carry the key.
          gpg --batch --keyserver hkps://pgp.mit.edu \
            --send-keys "$fingerprint" \
            || echo "::warning::pgp.mit.edu did not accept the key"
          gpg --batch --yes --armor --export "$fingerprint" \
            | curl --fail-with-body --silent --show-error \
                --data-urlencode keytext@- \
                https://keys.openpgp.org/vks/v1/upload
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      # The OSSRH-compatible endpoint only *stores* the upload. Gradle's
      # `maven-publish` makes plain PUTs, so the service cannot tell where one
      # deployment ends; until this call is made the artifacts sit in an
      # implicitly created staging repository that the Portal never sees. That
      # is why every release before 0.2.0 was absent from Central.
      #
      # `publishing_type=automatic` uploads the deployment and releases it to
      # Central once validation passes, which is the whole point of a tag. The
      # same namespace must come from the account that minted the token.
      - name: Hand the deployment to the Central Publisher Portal
        if: needs.validate.outputs.dry_run == 'false'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          NAMESPACE: io.github.xinvxueyuan
        run: |
          set -euo pipefail
          url="https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${NAMESPACE}?publishing_type=automatic"
          body="$(mktemp)"
          # Keyserver propagation is not instant, and Central reports a key it
          # has not indexed yet as a validation failure. Retry only that
          # message: any other 4xx is a real defect and must fail loudly.
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error -o "$body" -w '%{http_code}' \
              -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
              -X POST "$url")" || true
            cat "$body"
            echo
            case "$code" in
              2??) exit 0 ;;
            esac
            if grep -q 'Could not find a public key' "$body" && [ "$attempt" -lt 5 ]; then
              echo "the keyserver has not indexed the signing key yet; retrying in 30s"
              sleep 30
              continue
            fi
            echo "::error::the Portal rejected the deployment (HTTP $code)"
            exit 1
          done
      - name: List the published artifacts
        working-directory: bindings/kotlin
        run: find build/repo maven-dry-run -name "*.jar" -o -name "*.pom" 2>/dev/null | head -20 || true

  swift:
    name: Swift XCFramework
    needs: [validate, test]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Note the current scope
        run: |
          echo "Building the macOS XCFramework only. iOS needs BoringSSL"
          echo "cross-compiled for the iOS SDKs, which btls-sys does not do yet."
      - name: Generate the Swift binding
        run: cargo run -p xtask -- bindings --language swift --release
      - name: Build the static libraries
        run: |
          # macOS (arm64 + x86_64) for the SwiftPM binary target, plus iOS for
          # applications that embed the SDK.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            rustup target add "$target"
            cargo build -p novelai-image-ffi-uniffi --release --target "$target"
          done
          lipo -create             target/aarch64-apple-darwin/release/libnovelai_image_sdk_ffi.a             target/x86_64-apple-darwin/release/libnovelai_image_sdk_ffi.a             -output target/universal-macos.a
      - name: Assemble the XCFramework
        run: |
          xcodebuild -create-xcframework             -library target/universal-macos.a             -headers bindings/swift/generated             -output bindings/swift/NovelAIImageSDK.xcframework
          cd bindings/swift && zip -qr NovelAIImageSDK.xcframework.zip NovelAIImageSDK.xcframework
      - name: Print the checksum for Package.swift
        run: swift package compute-checksum bindings/swift/NovelAIImageSDK.xcframework.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift
          path: bindings/swift/NovelAIImageSDK.xcframework.zip

  github-release:
    name: GitHub release
    needs: [validate, test, python-wheels, pypi, npm-publish, maven, swift]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create the release
        if: needs.validate.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.validate.outputs.version }}"
          # A rerun is the normal repair path for a sibling job, and by then the
          # release (and its assets) already exist. `create` would fail on that,
          # so only create it when absent, then upload what is missing.
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" \
              artifacts/**/*.whl artifacts/**/*.node artifacts/**/*.zip \
              --clobber
          else
            gh release create "v$version" \
              --title "v$version" \
              --notes-file "release-notes/$version.json" \
              artifacts/**/*.whl artifacts/**/*.node artifacts/**/*.zip
          fi
