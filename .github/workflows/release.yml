name: Release

# A tag push is the only way to release. The `validate` job refuses a tag whose
# manifests disagree with the crate version, so a half-synced release fails
# before anything is published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.100.0"

      - name: The tag must match the manifest version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version }}" ]; then tag="${{ inputs.version }}"; fi
          manifest=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version' | sed 's/.*= *"\(.*\)"/\1/')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Manifests must agree
        run: cargo run -p xtask -- sync-versions --check

      - name: The tag must point at a commit on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi

      - name: Release notes must exist
        run: test -f "release-notes/${{ steps.version.outputs.version }}.json"

      - name: The changelog must have a section for this version
        run: grep -q "^## \\[${{ steps.version.outputs.version }}\\]" CHANGELOG.md

  test:
    name: Gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    # ci.yml gates publication; it must not run on stale cached artifacts.
    permissions:
      contents: read

  crate:
    name: crates.io
    needs: [validate, test]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Publish
        run: cargo publish -p novelai-image-sdk --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  python-wheels:
    name: Python wheels (${{ matrix.os }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Generate the binding module
        run: cargo run -p xtask -- bindings --language python --release
      - name: Build the wheel
        working-directory: bindings/python
        run: |
          cp ../../LICENSE .
          python -m pip install --upgrade build setuptools setuptools-rust wheel
          python -m build --wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  npm:
    name: npm (${{ matrix.target }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the napi CLI
        working-directory: bindings/node
        run: npm install --no-save @napi-rs/cli@3
      - name: Build the addon
        working-directory: bindings/node
        run: |
          npx napi build --release --platform \
            --manifest-path ../../crates/novelai-image-ffi-napi/Cargo.toml \
            --output-dir . --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  swift:
    name: Swift XCFramework
    needs: [validate, test]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install the iOS target
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Generate the Swift binding
        run: cargo run -p xtask -- bindings --language swift --release
      - name: Build the static libraries
        run: |
          # macOS (arm64 + x86_64) for the SwiftPM binary target, plus iOS for
          # applications that embed the SDK.
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim; do
            rustup target add "$target"
            cargo build -p novelai-image-ffi-uniffi --release --target "$target"
          done
          lipo -create             target/aarch64-apple-darwin/release/libnovelai_image_sdk_ffi.a             target/x86_64-apple-darwin/release/libnovelai_image_sdk_ffi.a             -output target/universal-macos.a
      - name: Assemble the XCFramework
        run: |
          xcodebuild -create-xcframework             -library target/universal-macos.a             -headers bindings/swift/generated             -library target/aarch64-apple-ios/release/libnovelai_image_sdk_ffi.a             -headers bindings/swift/generated             -library target/aarch64-apple-ios-sim/release/libnovelai_image_sdk_ffi.a             -headers bindings/swift/generated             -output bindings/swift/NovelAIImageSDK.xcframework
          cd bindings/swift && zip -qr NovelAIImageSDK.xcframework.zip NovelAIImageSDK.xcframework
      - name: Print the checksum for Package.swift
        run: swift package compute-checksum bindings/swift/NovelAIImageSDK.xcframework.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift
          path: bindings/swift/NovelAIImageSDK.xcframework.zip

  github-release:
    name: GitHub release
    needs: [validate, test, python-wheels, npm, swift]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.validate.outputs.version }}"
          gh release create "v$version" \
            --title "v$version" \
            --notes-file "release-notes/$version.json" \
            artifacts/**/*.whl artifacts/**/*.node artifacts/**/*.zip
