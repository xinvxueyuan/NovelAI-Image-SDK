name: Release

# A tag push is the only way to release. The `validate` job refuses a tag whose
# manifests disagree with the crate version, so a half-synced release fails
# before anything is published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.1.0)
        required: true
      dry_run:
        description: Build and verify every artifact, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Check out workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.100.0"

      - name: The tag must match the manifest version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version }}" ]; then tag="${{ inputs.version }}"; fi
          manifest=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^version' | sed 's/.*= *"\(.*\)"/\1/')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match Cargo.toml $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # A tag push always publishes; a manual run publishes only when the
          # caller turned dry-run off.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Manifests must agree
        run: cargo run -p xtask -- sync-versions --check

      - name: The tag must point at a commit on main
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi

      - name: Release notes must exist
        if: steps.version.outputs.dry_run == 'false'
        run: test -f "release-notes/${{ steps.version.outputs.version }}.json"

      - name: The changelog must have a section for this version
        run: grep -q "^## \\[${{ steps.version.outputs.version }}\\]" CHANGELOG.md

  test:
    name: Gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    # ci.yml gates publication; it must not run on stale cached artifacts.
    permissions:
      contents: read

  crate:
    name: crates.io
    needs: [validate, test]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Verify the crate packages
        run: cargo publish -p novelai-image-sdk --locked --dry-run
      - name: Publish
        if: needs.validate.outputs.dry_run == 'false'
        run: cargo publish -p novelai-image-sdk --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  python-wheels:
    name: Python wheels (${{ matrix.os }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux wheel must link an old glibc to be installable on
          # long-term-support distributions. The runner image is not, so the
          # build runs inside the official manylinux_2_28 container.
          - os: manylinux_2_28_x86_64
            runs-on: ubuntu-26.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: windows-2025
            runs-on: windows-2025
            container: ""
          - os: macos-26
            runs-on: macos-26
            container: ""
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build prerequisites in the container
        if: matrix.container != ''
        # The container has neither Rust nor libclang; both are needed.
        #
        # `RUSTUP_HOME` and `CARGO_HOME` are exported to `$GITHUB_ENV` because
        # the runner points `HOME` at /github/home while the container user's
        # real home is /root, and rustup refuses to run when the two disagree.
        run: |
          export RUSTUP_HOME=/root/.rustup CARGO_HOME=/root/.cargo
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs             | sh -s -- -y --profile minimal --default-toolchain 1.100.0
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
          dnf install -y clang cmake nasm perl-core zlib-devel
      - uses: ./.github/actions/setup-rust
        if: matrix.container == ''
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.container == ''
        with:
          python-version: "3.13"
      - name: Generate the binding module
        run: cargo run -p xtask -- bindings --language python --release
      - name: Build the wheel
        working-directory: bindings/python
        shell: bash
        # Bash on every runner so the same POSIX script works; the commands are
        # still `python …` rather than `cp`/`for`, which is what the Windows
        # failure earlier was about.
        #
        # The manylinux image does not put an interpreter on PATH; it ships
        # them under /opt/python. `$PYTHON` resolves once here so the same
        # commands work in both environments (GITHUB_ENV does not reach inside
        # the container).
        run: |
          PYTHON=python
          if [ -d /opt/python/cp313-cp313/bin ]; then
            PYTHON=/opt/python/cp313-cp313/bin/python
          fi
          "$PYTHON" -m pip install --upgrade build setuptools setuptools-rust wheel
          "$PYTHON" -c "import shutil; shutil.copy('../../LICENSE', 'LICENSE')"
          "$PYTHON" -m build --wheel
          "$PYTHON" scripts/retag_wheel.py
      - name: Repair the Linux wheel
        if: matrix.container != ''
        working-directory: bindings/python
        shell: bash
        # Renaming the tag is not enough: PyPI rejects `linux_x86_64`, and a
        # wheel claiming manylinux must actually link an older glibc than the
        # ubuntu-26.04 runner ships. auditwheel inspects the ELF symbols and
        # picks the tag; it fails loudly when the binary needs a newer glibc
        # than any long-term-support baseline provides, which is the signal to
        # move the build into a manylinux container.
        run: |
          PYTHON=/opt/python/cp313-cp313/bin/python
          "$PYTHON" -m pip install --quiet auditwheel
          rm -f dist/*manylinux*.whl
          "$PYTHON" -m auditwheel repair --wheel-dir dist dist/*.whl
          ls dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  pypi:
    name: PyPI
    needs: [validate, python-wheels]
    runs-on: ubuntu-26.04
    environment: release
    # PyPI Trusted Publishing: no token, the OIDC identity is the credential.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check the wheels
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*
      - name: Publish to PyPI
        if: needs.validate.outputs.dry_run == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  npm:
    name: npm (${{ matrix.target }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          # Native x64, so BoringSSL is not cross-compiled.
          - os: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the cross target
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Install the napi CLI
        working-directory: bindings/node
        shell: bash
        run: npm install --no-save @napi-rs/cli@3
      - name: Build the addon
        working-directory: bindings/node
        # One line on purpose: a backslash continuation is not portable
        # across the default shells of the three runners.
        run: npx napi build --release --platform --manifest-path ../../crates/novelai-image-ffi-napi/Cargo.toml --output-dir . --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  npm-publish:
    name: npm publish
    needs: [validate, npm]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: bindings/node
          merge-multiple: true
      - name: Install the napi CLI
        working-directory: bindings/node
        shell: bash
        run: npm install --no-save @napi-rs/cli@3
      - name: Build the platform packages
        working-directory: bindings/node
        # `create-npm-dirs` reads the `.node` files beside package.json (the
        # download step put them there); `napi artifacts` expects a separate
        # `artifacts/` directory that this layout does not use.
        run: |
          npx napi create-npm-dirs
          # Each downloaded addon is named `<binary>.<platformArchABI>.node`.
          # Move it into the matching platform package by that suffix, so a
          # Windows binary can never land in the macOS package.
          for addon in *.node; do
            suffix="${addon#*.}"          # drop the binary name
            suffix="${suffix%.node}"      # drop the extension
            if [ -d "npm/$suffix" ]; then
              mv "$addon" "npm/$suffix/"
            else
              echo "no platform package for $addon" >&2
              exit 1
            fi
          done
          ls -R npm | head -30
      - name: Pack the tarballs
        working-directory: bindings/node
        run: |
          # `npm pack` exercises the same manifest resolution as publish and
          # writes a tarball we can inspect.
          mkdir -p /tmp/npm-packs
          for dir in npm/*/; do
            npm pack "$dir" --pack-destination /tmp/npm-packs
          done
          npm pack --pack-destination /tmp/npm-packs
          ls -la /tmp/npm-packs
      - name: Publish
        if: needs.validate.outputs.dry_run == 'false'
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Platform packages first: the root package depends on them.
          for dir in npm/*/; do
            npm publish "$dir" --access public --provenance
          done
          npm publish --access public --provenance

  kotlin:
    name: Kotlin JAR
    needs: [validate, test]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Package the Linux native library
        run: cargo run -p xtask -- bindings --language kotlin --release
      - name: Build the JAR
        working-directory: bindings/kotlin
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-jar
          path: bindings/kotlin/build/libs/*.jar

  kotlin-native:
    name: Kotlin native library (${{ matrix.platform }})
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win-x64
          - os: macos-26
            platform: mac-arm64
          - os: ubuntu-26.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Build the library
        run: cargo run -p xtask -- bindings --language kotlin --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-native-${{ matrix.platform }}
          path: bindings/kotlin/src/main/resources/${{ matrix.platform }}/

  maven:
    name: Maven Central
    needs: [validate, test, kotlin, kotlin-native]
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kotlin-native-*
          path: bindings/kotlin/src/main/resources
          merge-multiple: false
      - name: Flatten the native resources
        working-directory: bindings/kotlin/src/main/resources
        run: |
          # download-artifact nests each artifact under its own directory;
          # move `<platform>/…` up one level so the JAR layout is flat.
          for dir in kotlin-native-*/; do
            platform="${dir#kotlin-native-}"
            platform="${platform%/}"
            mkdir -p "$platform"
            cp -r "$dir"* "$platform"/ 2>/dev/null || true
            rm -rf "$dir"
          done
          ls -R .
      - name: Publish to Maven Central
        working-directory: bindings/kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # Central requires a detached signature on every artifact. The same
          # key that signs commits signs the JAR.
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          # A dry run publishes to a local directory instead of Central.
          MAVEN_CENTRAL_URL: ${{ needs.validate.outputs.dry_run == 'true' && format('file://{0}/maven-dry-run', github.workspace) || 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/' }}
        run: gradle publish --no-daemon
      - name: List the published artifacts
        working-directory: bindings/kotlin
        run: find build/repo maven-dry-run -name "*.jar" -o -name "*.pom" 2>/dev/null | head -20 || true

  swift:
    name: Swift XCFramework
    needs: [validate, test]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Note the current scope
        run: |
          echo "Building the macOS XCFramework only. iOS needs BoringSSL"
          echo "cross-compiled for the iOS SDKs, which btls-sys does not do yet."
      - name: Generate the Swift binding
        run: cargo run -p xtask -- bindings --language swift --release
      - name: Build the static libraries
        run: |
          # macOS (arm64 + x86_64) for the SwiftPM binary target, plus iOS for
          # applications that embed the SDK.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            rustup target add "$target"
            cargo build -p novelai-image-ffi-uniffi --release --target "$target"
          done
          lipo -create             target/aarch64-apple-darwin/release/libnovelai_image_sdk_ffi.a             target/x86_64-apple-darwin/release/libnovelai_image_sdk_ffi.a             -output target/universal-macos.a
      - name: Assemble the XCFramework
        run: |
          xcodebuild -create-xcframework             -library target/universal-macos.a             -headers bindings/swift/generated             -output bindings/swift/NovelAIImageSDK.xcframework
          cd bindings/swift && zip -qr NovelAIImageSDK.xcframework.zip NovelAIImageSDK.xcframework
      - name: Print the checksum for Package.swift
        run: swift package compute-checksum bindings/swift/NovelAIImageSDK.xcframework.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift
          path: bindings/swift/NovelAIImageSDK.xcframework.zip

  github-release:
    name: GitHub release
    needs: [validate, test, python-wheels, pypi, npm-publish, maven, swift]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create the release
        if: needs.validate.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.validate.outputs.version }}"
          gh release create "v$version" \
            --title "v$version" \
            --notes-file "release-notes/$version.json" \
            artifacts/**/*.whl artifacts/**/*.node artifacts/**/*.zip
