# `plugins.gradle.org` and `repo.maven.apache.org` share one rate-limit budget
# across every hosted runner, so a build occasionally resolves a POM to
# `429 Too Many Requests`. It is transient and unrelated to the project: retry
# rather than fail the release.
#
# These are read when the build JVM starts, which is early enough to cover the
# plugin resolution that fails first.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=3000

# The JAR is a binding, not an application: its own tests run in `cargo xtask
# check`, so Gradle only has to compile and package.
org.gradle.parallel=true
