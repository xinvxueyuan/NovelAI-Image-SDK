# `plugins.gradle.org` and `repo.maven.apache.org` share one rate-limit budget
# across every hosted runner, so a build occasionally resolves a POM to
# `429 Too Many Requests`. It is transient and unrelated to the project: retry
# rather than fail the release.
#
# The property is `max.tentatives`, NOT `max.retries` — Gradle renamed it before
# 5.0 and the old name is silently ignored, which is why the first attempt at
# this changed nothing. Each key is also written in its `systemProp.` form
# because Gradle reads these with `Integer.getInteger()`, i.e. as JVM system
# properties; a plain entry alone does not reach that lookup.
org.gradle.internal.repository.max.tentatives=5
org.gradle.internal.repository.initial.backoff=3000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=3000

# The JAR is a binding, not an application: its own tests run in `cargo xtask
# check`, so Gradle only has to compile and package.
org.gradle.parallel=true
